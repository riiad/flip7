<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root { color-scheme: light; } body { margin: 0; } [hidden] { display: none !important; }</style>
<title>Carnet Flip 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap">
<style>
/* Layout: players at the table on top, the deck always open at the bottom of the screen */
:root {
  --ground: #EAF2F0; --surface: #FFFFFF; --ink: #10292D; --muted: #56706F; --line: #D2E0DC;
  --accent: #F4B000; --on-accent: #231A00; --bust: #C8412F;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0B1C1F; --surface: #13292C; --ink: #E4F0EE; --muted: #8EA6A6; --line: #244140;
    --accent: #FFC233; --bust: #F2705F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0B1C1F; --surface: #13292C; --ink: #E4F0EE; --muted: #8EA6A6; --line: #244140;
  --accent: #FFC233; --bust: #F2705F; color-scheme: dark;
}
body { background: var(--ground); color: var(--ink); font: 16px/1.45 var(--body); padding-inline: 16px; }
main { max-width: 34rem; margin: 0 auto; padding-block: 1.5rem 3rem; display: grid; gap: 1rem; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }

header { display: flex; align-items: end; justify-content: space-between; gap: .5rem 1rem; flex-wrap: wrap; }
h1 { font: 400 2.2rem/1 var(--display); margin: 0; }
h1 b {
  display: inline-grid; place-items: center; width: 1.2em; height: 1.55em; margin-left: .12em;
  background: var(--accent); color: var(--on-accent); border-radius: .16em; font-weight: 400;
  transform: rotate(6deg); box-shadow: 0 3px 0 rgb(0 0 0 / .18);
}
.goal { margin: 0; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.goal strong { font: 400 1.25rem var(--display); color: var(--ink); letter-spacing: 0; }
.rules { margin: 0; color: var(--muted); font-size: .875rem; max-width: 60ch; }

#msg { margin: 0; padding: .75rem 1rem; border-radius: 10px; border: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; }
#msg.win { background: var(--accent); color: var(--on-accent); border-color: transparent; font-size: 1.1rem; }
#msg button { background: none; border: 0; padding: 0; font-weight: 600; text-decoration: underline; }

#players { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
#players:empty::after { content: "Ajoutez au moins deux joueurs ci-dessous."; color: var(--muted); }
.p {
  display: grid; grid-template-columns: minmax(0, 1fr) auto 3.75rem auto; align-items: center;
  gap: .4rem .6rem; padding: .6rem .5rem .7rem .9rem; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.p.sel { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.pick { display: grid; gap: .3rem; justify-items: start; text-align: left; background: none; border: 0; padding: 0; min-width: 0; }
.nm { font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; }
.hand { display: flex; flex-wrap: wrap; gap: 3px; min-height: 1.35rem; }
.hand i {
  font: normal 400 .72rem/1 var(--display); padding: .25rem .32rem; border-radius: 4px;
  background: var(--ground); border: 1px solid var(--line);
}
.hand i.m { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.hand:empty::after { content: "Aucune carte"; font-size: .8rem; color: var(--muted); }
.p.busted .hand i { text-decoration: line-through; opacity: .55; }
.live { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.live.bust { color: var(--bust); }
.total { font: 400 1.4rem/1 var(--display); text-align: right; padding: .3rem .35rem; border-radius: 6px; }
.total.lead { background: var(--accent); color: var(--on-accent); }
.x { background: none; border: 0; color: var(--muted); min-width: 2rem; height: 2rem; border-radius: 6px; font-size: 1.2rem; }
.x:hover { background: var(--line); }
.x[data-armed] { color: var(--bust); font-size: .8rem; font-weight: 600; }
.bar { grid-column: 1 / -1; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); transition: width .4s ease; }

#add { display: flex; gap: .5rem; }
#add input { flex: 1; min-width: 0; font: inherit; padding: .6rem .75rem; border: 1px dashed var(--muted); border-radius: 10px; background: none; color: var(--ink); }
.ghost { background: none; border: 1px solid var(--line); border-radius: 10px; padding: .6rem .9rem; }
.ghost:hover:not(:disabled) { background: var(--surface); }
.ghost[data-armed] { color: var(--bust); border-color: var(--bust); }
.go {
  font: 400 1.1rem var(--display); background: var(--accent); color: var(--on-accent); border: 0;
  border-radius: 12px; padding: .85rem 1rem; box-shadow: 0 3px 0 rgb(0 0 0 / .2);
}
.go:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgb(0 0 0 / .2); }

#pad {
  position: sticky; bottom: 0; z-index: 1; display: grid; gap: .5rem; margin-inline: -16px;
  padding: .75rem 16px calc(.75rem + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -10px 30px rgb(0 0 0 / .12);
}
@media (min-width: 36rem) { #pad { margin-inline: 0; border: 1px solid var(--line); border-radius: 16px; } }
.padhead { margin: 0; display: flex; justify-content: space-between; gap: .5rem 1rem; flex-wrap: wrap; font-size: .9rem; }
#padNote { color: var(--muted); }
#padNote.bad { color: var(--bust); font-weight: 600; }
.deck { display: grid; grid-template-columns: repeat(7, 1fr); gap: .35rem; }
.deck button {
  height: 2.7rem; padding: 0; font: 400 1.05rem var(--display);
  background: var(--ground); border: 1px solid var(--line); border-radius: 7px; transition: transform .12s;
}
.deck.mods { grid-template-columns: repeat(6, 1fr); }
.deck.mods button { height: 2.3rem; font-size: .9rem; }
.deck button[aria-pressed="true"], .deck button[data-on] {
  background: var(--accent); color: var(--on-accent); border-color: transparent;
  transform: translateY(-2px); box-shadow: 0 2px 0 rgb(0 0 0 / .2);
}
.deck button[data-on]:disabled, .deck button[aria-pressed="true"]:disabled { opacity: 1; }
.tools { display: flex; gap: .4rem; }
.tools button { flex: 1; padding: .5rem .4rem; font-size: .85rem; line-height: 1.15; }
#sc[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
#bust { color: var(--bust); border-color: var(--bust); }
#bust[aria-pressed="true"] { background: var(--bust); color: var(--surface); }

h2 { margin: .5rem 0 0; font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sheet { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: .5rem .75rem; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child { text-align: left; color: var(--muted); font-weight: 400; }
thead th { font-weight: 600; font-size: .875rem; }
tbody tr:last-child > * { border-bottom: 0; }
td.bust { color: var(--bust); }
.foot { display: flex; flex-wrap: wrap; gap: .5rem; }
@media (prefers-reduced-motion: reduce) { .bar i, .deck button { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Flip<b>7</b></h1>
    <p class="goal">Premier à <strong>200</strong></p>
  </header>
  <p class="rules">Touche un joueur, puis ses cartes. ×2 double les cartes numéros, 7 cartes numéros = +15, un doublon = bust.</p>
  <p id="msg" hidden></p>
  <ol id="players"></ol>
  <form id="add"><input id="newName" placeholder="Nom du joueur" maxlength="20" aria-label="Nom du nouveau joueur"><button class="ghost">Ajouter</button></form>

  <section id="pad" aria-label="Cartes">
    <p class="padhead"><span>Cartes de <strong id="padWho"></strong></span><span id="padNote" aria-live="polite"></span></p>
    <div class="deck" id="nums"></div>
    <div class="deck mods" id="mods"></div>
    <div class="tools">
      <button type="button" class="ghost" id="sc" data-act="sc" aria-pressed="false">Seconde Chance</button>
      <button type="button" class="ghost" id="bust" data-act="bust" aria-pressed="false">Bust</button>
      <button type="button" class="ghost" id="undoCard" data-act="undoCard">Annuler la carte</button>
    </div>
    <button class="go" id="go" data-act="round">Valider la manche</button>
  </section>

  <section id="history" hidden>
    <h2>Manches</h2>
    <div class="sheet"><table id="hist"></table></div>
  </section>
  <div class="foot">
    <button class="ghost" id="undo" data-act="undo">Annuler la dernière manche</button>
    <button class="ghost" data-act="reset">Nouvelle partie</button>
  </div>
</main>

<script>
const KEY = 'flip7-carnet', GOAL = 200;
const COLORS = ['#E4572E', '#2E86AB', '#9B5DE5', '#3BA55C', '#E0A100', '#D63384', '#159CAD', '#7A8B8C'];
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<"]/g, c => ({ '&': '&amp;', '<': '&lt;', '"': '&quot;' })[c]);
const empty = () => ({ nums: [], mods: [], sc: false, bust: false });

let s;
try { s = JSON.parse(localStorage.getItem(KEY)); } catch {}
s ||= { ex: true, next: 4,
  players: [{ id: 1, name: 'Camille' }, { id: 2, name: 'Sam' }, { id: 3, name: 'Noor' }],
  rounds: [{ 1: 34, 2: 0, 3: 27 }, { 1: 21, 2: 52, 3: 0 }],
  hand: { 1: { nums: [2, 5, 9], mods: [4], sc: false, bust: false }, 2: { nums: [6, 11], mods: [], sc: true, bust: false } } };
s.hand ||= {};

let sel = s.players.find(p => !s.hand[p.id])?.id ?? s.players[0]?.id, note = '';
const hist = []; // card taps this round, for "Annuler la carte"

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} };
const commit = () => { save(); render(); };
const totals = () => Object.fromEntries(s.players.map(p => [p.id, s.rounds.reduce((a, r) => a + (r[p.id] || 0), 0)]));

function status(players, t) {
  const max = Math.max(0, ...players.map(p => t[p.id]));
  const top = players.filter(p => t[p.id] === max);
  return { max, winner: max >= GOAL && top.length === 1 ? top[0] : null, tie: max >= GOAL && top.length > 1 };
}

// Flip 7: ×2 doubles the number cards only, then the +N modifiers, then +15 for seven number cards.
function roundScore(nums, mods) {
  const sum = nums.reduce((a, n) => a + n, 0);
  const plus = mods.filter(m => m !== 'x2').reduce((a, m) => a + m, 0);
  return sum * (mods.includes('x2') ? 2 : 1) + plus + (nums.length === 7 ? 15 : 0);
}
const handTotal = h => h.bust ? 0 : roundScore(h.nums, h.mods);

// A number already in the hand is a duplicate: the Second Chance absorbs it, otherwise bust.
function drawNumber(h, n) {
  if (!h.nums.includes(n)) h.nums.push(n);
  else if (h.sc) { h.sc = false; return `Seconde Chance utilisée sur le ${n}.`; }
  else { h.bust = true; return `Deuxième ${n} : bust.`; }
  return '';
}

const chips = h => [
  ...[...h.nums].sort((a, b) => a - b).map(n => `<i>${n}</i>`),
  ...[...h.mods].sort((a, b) => (a === 'x2') - (b === 'x2') || a - b).map(m => `<i class="m">${m === 'x2' ? '×2' : '+' + m}</i>`),
  h.sc ? '<i class="m">2de chance</i>' : '',
].join('');

function render() {
  const t = totals(), st = status(s.players, t), n = s.rounds.length + 1;
  $('players').innerHTML = s.players.map(p => {
    const h = s.hand[p.id] || empty(), live = handTotal(h);
    return `
    <li class="p${p.id === sel ? ' sel' : ''}${h.bust ? ' busted' : ''}" data-id="${p.id}" style="--c:${COLORS[p.id % COLORS.length]}">
      <button class="pick" data-act="pick" data-id="${p.id}" aria-pressed="${p.id === sel}">
        <span class="nm">${esc(p.name)}</span><span class="hand">${chips(h)}</span>
      </button>
      <span class="live${h.bust ? ' bust' : ''}">${h.bust ? 'Bust' : live ? '+' + live : ''}</span>
      <output class="total${st.max > 0 && t[p.id] === st.max ? ' lead' : ''}">${t[p.id]}</output>
      <button class="x" data-act="del" data-id="${p.id}" aria-label="Retirer ${esc(p.name)}">×</button>
      <div class="bar"><i style="width:${Math.min(t[p.id] / GOAL, 1) * 100}%"></i></div>
    </li>`;
  }).join('');

  const msg = $('msg');
  msg.className = st.winner ? 'win' : '';
  msg.innerHTML = s.ex ? `Partie d'exemple. <button type="button" data-act="fresh">Commencer une vraie partie</button>`
    : st.winner ? `<span><strong>${esc(st.winner.name)}</strong> gagne avec ${st.max} points.</span>`
    : st.tie ? `Égalité à ${st.max} points : on joue une manche de plus.` : '';
  msg.hidden = !msg.innerHTML;

  const p = s.players.find(p => p.id === sel), h = s.hand[sel] || empty();
  $('pad').hidden = !p || !!st.winner;
  if (p) {
    $('padWho').textContent = p.name;
    $('padNote').textContent = note || (h.bust ? 'Bust : 0 point' : h.nums.length === 7 ? 'Flip 7 : +15' : '');
    $('padNote').className = h.bust ? 'bad' : '';
    for (const b of $('nums').children) {
      const k = +b.dataset.n, on = h.nums.includes(k);
      b.toggleAttribute('data-on', on);
      b.setAttribute('aria-label', on ? `${k}, déjà dans la main` : k);
      b.disabled = h.bust || h.nums.length >= 7;
    }
    for (const b of $('mods').children) { b.setAttribute('aria-pressed', h.mods.includes(modKey(b))); b.disabled = h.bust; }
    $('sc').setAttribute('aria-pressed', h.sc);
    $('sc').disabled = h.bust;
    $('bust').setAttribute('aria-pressed', h.bust);
    $('undoCard').disabled = !hist.length;
    $('go').textContent = `Valider la manche ${n}`;
  }
  $('undo').disabled = !s.rounds.length;

  $('history').hidden = !s.rounds.length;
  $('hist').innerHTML = `<thead><tr><th>Manche</th>${s.players.map(p => `<th>${esc(p.name)}</th>`).join('')}</tr></thead>
    <tbody>${s.rounds.map((r, i) => `<tr><th>${i + 1}</th>${s.players.map(p =>
      `<td${r[p.id] === 0 ? ' class="bust"' : ''}>${r[p.id] ?? '–'}</td>`).join('')}</tr>`).join('')}</tbody>`;
}

const modKey = b => b.dataset.m === 'x2' ? 'x2' : +b.dataset.m;
$('nums').innerHTML = Array.from({ length: 13 }, (_, n) => `<button type="button" data-act="num" data-n="${n}">${n}</button>`).join('');
$('mods').innerHTML = [2, 4, 6, 8, 10].map(m => `<button type="button" data-act="mod" data-m="${m}">+${m}</button>`).join('')
  + '<button type="button" data-act="mod" data-m="x2">×2</button>';

// Every tap on the deck changes the selected player's hand and can be undone.
function play(fn) {
  if (sel == null) return;
  s.hand[sel] ||= empty();
  hist.push({ id: sel, h: structuredClone(s.hand[sel]) });
  note = fn(s.hand[sel]) || '';
  commit();
}

function scoreRound() {
  const r = {};
  for (const p of s.players) r[p.id] = s.hand[p.id] ? handTotal(s.hand[p.id]) : 0;
  s.rounds.push(r);
  newRound();
}

function newRound() {
  s.hand = {}; hist.length = 0; note = ''; sel = s.players[0]?.id;
  commit();
  scrollTo({ top: 0, behavior: 'smooth' });
}

function reset(clear) {
  s = { next: s.next, players: clear ? [] : s.players, rounds: [], hand: {} };
  newRound();
}

// Two taps for anything that throws scores away (the viewer blocks confirm()).
function armed(btn, label, fn) {
  if (btn.dataset.armed) return fn();
  const old = btn.textContent;
  btn.dataset.armed = 1; btn.textContent = label;
  setTimeout(() => { delete btn.dataset.armed; btn.textContent = old; }, 3000);
}

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  const row = e.target.closest('.p');
  if (!b) { if (row) { sel = +row.dataset.id; note = ''; render(); } return; }
  const id = +b.dataset.id;
  ({
    pick: () => { sel = id; note = ''; render(); },
    num: () => play(h => drawNumber(h, +b.dataset.n)),
    mod: () => play(h => { const m = modKey(b), i = h.mods.indexOf(m); i < 0 ? h.mods.push(m) : h.mods.splice(i, 1); }),
    sc: () => play(h => { h.sc = !h.sc; }),
    bust: () => play(h => { h.bust = !h.bust; }),
    undoCard: () => { const u = hist.pop(); s.hand[u.id] = u.h; sel = u.id; note = ''; commit(); },
    round: scoreRound,
    fresh: () => reset(true),
    undo: () => armed(b, 'Confirmer l’annulation', () => { s.rounds.pop(); commit(); }),
    reset: () => s.ex ? reset(true) : armed(b, 'Confirmer : tout remettre à 0', () => reset(false)),
    del: () => armed(b, 'Retirer ?', () => {
      s.players = s.players.filter(p => p.id !== id); delete s.hand[id];
      if (sel === id) sel = s.players[0]?.id;
      commit();
    }),
  })[b.dataset.act]();
});

$('add').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('newName').value.trim();
  if (!name) return;
  s.players.push({ id: s.next++, name });
  sel ??= s.players.at(-1).id;
  $('newName').value = '';
  commit();
});

render();
</script>
</body>
</html>
